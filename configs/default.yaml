# Configuração central do projeto. Caminhos podem ser sobrescritos por
# variável de ambiente (NEUROICU_DATA_DIR) ou pela linha de comando.

data:
  dir: data/raw            # pasta local com os pacientes (ex.: i-care/training)
  dataset_version: "2.1"   # versão do I-CARE usada (fixe para reprodutibilidade)
  groups: [EEG]            # grupos do I-CARE a ler: EEG, ECG, REF, OTHER
  max_hour: 72             # usar só as primeiras 72 h após a parada

# Montagem bipolar longitudinal (dupla banana) + linha média: 18 derivações
montage:
  bipolar_pairs:
    - [Fp1, F7]
    - [F7, T3]
    - [T3, T5]
    - [T5, O1]
    - [Fp2, F8]
    - [F8, T4]
    - [T4, T6]
    - [T6, O2]
    - [Fp1, F3]
    - [F3, C3]
    - [C3, P3]
    - [P3, O1]
    - [Fp2, F4]
    - [F4, C4]
    - [C4, P4]
    - [P4, O2]
    - [Fz, Cz]
    - [Cz, Pz]

seed: 42
